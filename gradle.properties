# Gradle JVM 参数：强制使用 IPv4 避免 Windows 下代理/TUN 模式的 getsockopt 超时
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true

# HTTP/HTTPS 代理配置（7897 端口）
# 本机该端口未开，部署时改为直连；需要走代理时再取消下面注释
#systemProp.http.proxyHost=127.0.0.1
#systemProp.http.proxyPort=7897
#systemProp.https.proxyHost=127.0.0.1
#systemProp.https.proxyPort=7897
#systemProp.http.nonProxyHosts=localhost|127.*|[::1]

# JDK 21 toolchain 位置（build.gradle.kts 用 toolchain 21 编译）
# <LOCAL_JDK_DIR> 不在 Gradle 自动扫描目录里，不写这行命令行 gradlew 会报
# "Failed to calculate ... property 'javaCompiler'"（IDEA 会自己注入 JDK，所以 IDE 里没这问题）
org.gradle.java.installations.paths=<LOCAL_JDK_PATH>
